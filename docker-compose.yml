# Tier B services for `okf`: a vector store and an embeddings server.
#
# Tier A needs none of this. Everything okf does offline -- scope, drift,
# fan-in, index.md -- works with no services at all, and that is most of the
# value. Bring this up only when you want `okf chunk`, `okf embed` and
# `okf search`.
#
#   docker compose up -d
#
# The defaults `okf init` writes point here, so a bundle created after this is
# running needs no edits to okf.json.
#
# Why one dependency instead of two: an embeddings server in a container beats
# asking for Docker *and* Ollama. `michaelf34/infinity:latest-cpu` is ~750 MB
# compressed; the default `michaelf34/infinity:latest` is ~4.8 GB because it
# carries a full CUDA runtime this stack never uses.

services:
  qdrant:
    image: qdrant/qdrant
    container_name: okf-qdrant
    ports:
      - "6333:6333"   # REST -- what okf speaks
      - "6334:6334"   # gRPC -- unused by okf, exposed for other clients
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  embeddings:
    image: michaelf34/infinity:latest-cpu
    container_name: okf-embeddings
    # Infinity's entrypoint is `infinity_emb`, so this is its argument list.
    # Note the endpoint is /embeddings, NOT /v1/embeddings -- the response is
    # OpenAI-shaped either way, and okf validates the URL's scheme rather than
    # its path, so the full URL in okf.json is what matters.
    command: v2 --model-id nomic-ai/nomic-embed-text-v1.5 --device cpu
    ports:
      - "7997:7997"
    volumes:
      # Without this the model is re-downloaded every time the container is
      # recreated. It is a few hundred MB.
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped

volumes:
  qdrant_storage:
  hf_cache:
